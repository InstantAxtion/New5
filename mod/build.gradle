plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.neoterra'
base { archivesName = 'neoterra' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://ldtteam.jfrog.io/ldtteam/modding/' }
    mavenCentral()
}

neoForge {
    version = project.neo_version
    mods { neoterra { sourceSet sourceSets.main } }
    runs { server { server(); programArgument '--nogui'; systemProperty 'neoterra.selftest', 'true' } }
}

// the self-test needs a fresh world: huts left over from an earlier run would capture the new ones
tasks.matching { it.name == 'runServer' }.configureEach { doFirst { delete "$projectDir/run/world" } }

dependencies {
    implementation("com.ldtteam:minecolonies:${minecolonies_version}") { transitive = true }
    implementation("com.ldtteam:structurize:1.0.837-1.21.1-snapshot")
    implementation("com.ldtteam:blockui:1.0.199-1.21.1-snapshot")
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// the four style packs ship inside the same jar
processResources {
    ['Neoterra', 'Hearthwood', 'Cascadia', 'Farmworks'].each { p ->
        from("../stylepacks/${p}") { into "blueprints/neoterra/${p}" }
    }
    from('../stylepacks/Neoterra/neoterra.png')
}
